<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quark Auto Download</title>
  <style>
    :root {
      --bg: #0f1412;
      --panel: #171e1b;
      --panel-2: #1e2823;
      --line: #2c3a33;
      --text: #e7eee9;
      --muted: #8fa196;
      --accent: #3dba7a;
      --accent-dim: #2a8f5c;
      --danger: #d4534a;
      --warn: #c9a227;
      --radius: 10px;
      --sidebar-w: 300px;
      --topbar-h: 4rem;
      --font: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --mono: ui-monospace, "Sarasa Mono SC", "Cascadia Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 8% -8%, #1a3328 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, #1a2430 0%, transparent 50%),
        var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      height: 100%;
      min-height: 0;
      max-height: 100%;
    }
    .sidebar-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: .5rem; height: var(--topbar-h); min-height: var(--topbar-h);
      padding: 0 1rem; border-bottom: 1px solid var(--line); box-sizing: border-box;
    }
    .sidebar-brand {
      font-family: var(--mono); font-size: .65rem; letter-spacing: .06em; line-height: 1.2;
      text-transform: uppercase; color: var(--accent); margin: 0;
    }
    .sidebar-title { margin: .15rem 0 0; font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
    .icon-btn {
      width: 2.1rem; height: 2.1rem; padding: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.25rem; line-height: 1; font-weight: 600;
    }
    .sidebar-body { flex: 1; overflow: auto; padding: .65rem .7rem; }
    .sidebar-foot {
      padding: .75rem .9rem; border-top: 1px solid var(--line);
      display: flex; gap: .5rem; flex-wrap: wrap;
    }
    .add-form {
      margin: 0 .7rem .55rem; padding: .75rem;
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
    }
    .add-form.hidden { display: none; }
    .add-form label { display: block; font-size: .72rem; color: var(--muted); margin: .45rem 0 .2rem; }
    .add-form label:first-child { margin-top: 0; }
    .add-form input {
      width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text);
      border-radius: 8px; padding: .5rem .6rem; font: 500 .82rem/1.35 var(--mono); outline: none;
    }
    .add-form input:focus { border-color: var(--accent-dim); }
    .add-actions { display: flex; gap: .4rem; margin-top: .65rem; }
    /* 框高 3.5rem；任务名字高/行高 2.8rem（80%），上下 padding 各 0.35rem（10%） */
    .job-item {
      width: 100%; text-align: left; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--text);
      padding: .35rem .75rem; height: 3.5rem; min-height: 3.5rem; margin-bottom: .45rem;
      box-sizing: border-box;
      display: flex; align-items: center;
      cursor: pointer; font: 500 .82rem/1.35 var(--font);
    }
    .job-item:hover { background: color-mix(in srgb, var(--panel-2) 80%, transparent); border-color: var(--line); }
    .job-item.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--panel-2));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .job-item-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: .55rem; min-width: 0; width: 100%;
      height: 2.8rem; min-height: 2.8rem;
    }
    .job-item-url {
      flex: 1 1 auto; min-width: 0;
      font-family: var(--mono); font-size: 2.8rem; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      line-height: 2.8rem;
    }
    .job-item-meta {
      flex: 0 1 auto; max-width: 55%; min-width: 0;
      margin: 0; font-size: .95rem; color: var(--muted); font-family: var(--mono);
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      gap: .08rem; overflow: hidden;
    }
    .job-item-meta .pill { flex-shrink: 0; font-size: .95rem; line-height: 1.2; }
    .job-item-meta [data-role="item-progress"] {
      min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: .88rem; line-height: 1.2; text-align: right;
    }
    .main {
      display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden;
    }
    .main-bar {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem;
      min-height: var(--topbar-h);
      padding: .55rem 1.25rem; border-bottom: 1px solid var(--line); box-sizing: border-box;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
    }
    .main-bar-title {
      display: flex; align-items: flex-start; gap: .55rem; min-width: 0; flex: 1;
    }
    .main-bar h1 {
      margin: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.35;
      min-width: 0; overflow-wrap: anywhere; word-break: break-all;
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 1rem;
    }
    .main-bar h1 .detail-title-name {
      min-width: 0; cursor: text; border-radius: 4px;
      border: 1px solid transparent; padding: .1rem .25rem; margin: -.1rem -.25rem;
    }
    .main-bar h1 .detail-title-name:hover {
      border-color: var(--line); background: color-mix(in srgb, var(--panel-2) 70%, transparent);
    }
    .main-bar h1 .detail-title-name[hidden] { display: none; }
    .main-bar h1 .detail-title-edit {
      min-width: 8rem; max-width: min(28rem, 70vw); flex: 1 1 auto;
      border: 1px solid var(--accent-dim); border-radius: 6px;
      background: var(--bg); color: var(--text);
      padding: .2rem .45rem; font: 600 1.05rem/1.35 var(--font); outline: none;
    }
    .main-bar h1 .detail-title-edit[hidden] { display: none; }
    .main-bar h1 a.detail-share-url {
      font-family: var(--mono); font-size: .82rem; font-weight: 500;
      color: var(--accent); text-decoration: none; word-break: break-all;
    }
    .main-bar h1 a.detail-share-url:hover { text-decoration: underline; }
    .main-bar h1 a.detail-share-url[hidden] { display: none; }
    /* padding-top 与 .sidebar-body 一致，使详情首行与左侧首个 .job-item 顶边平齐；
       底边无 padding，使日志框下沿与侧栏 foot（含设置）底边对齐 */
    .main-body {
      position: relative;
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding: .65rem 1.25rem 0; overflow: hidden;
    }
    /* 详情区无外层卡片框，仅保留内部 stats / log 等分区；列布局把剩余高度交给日志 */
    .detail {
      margin: 0; padding: 0; background: transparent; border: 0;
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .detail[hidden] { display: none; }
    .empty-hint { flex-shrink: 0; }
    /* 消息叠在日志上方，不占用高度、不把日志顶离侧栏底边 */
    #jobs-msg {
      flex: 0 0 auto; margin: 0; min-height: 0;
      position: absolute; left: 1.25rem; right: 1.25rem; bottom: .35rem;
      z-index: 2; pointer-events: none;
    }
    #jobs-msg:empty { display: none; }
    button {
      border: 0; border-radius: 8px; padding: .65rem 1rem; font: 600 .88rem/1 var(--font); cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #062214; }
    .btn-danger { background: color-mix(in srgb, var(--danger) 88%, #000); color: #fff; }
    .btn-warn { background: color-mix(in srgb, var(--warn) 85%, #000); color: #1a1400; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    a.btn-ghost {
      display: inline-flex; align-items: center; text-decoration: none;
      border: 1px solid var(--line); border-radius: 8px; padding: .55rem .9rem;
      font: 600 .82rem/1 var(--font); color: var(--text);
    }
    a.btn-ghost:hover { border-color: var(--accent-dim); color: var(--accent); }
    .msg { margin-top: .55rem; min-height: 1.1rem; font-size: .82rem; color: var(--muted); }
    .msg.ok { color: var(--accent); }
    .msg.err { color: #ff8e86; }
    .empty-hint { color: var(--muted); font-size: .9rem; padding: 2rem 0; text-align: center; }
    .job-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin: 0 0 .25rem; align-items: center; }
    /* 开始 / 暂停 / 删除：统一尺寸与字号；delete 的 margin-left:auto 仅推到右侧 */
    .job-action-btn {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: .65rem 1rem;
      min-width: 5.75rem;
      min-height: 2.4rem;
      font-size: .88rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .job-actions [data-act="delete"] { margin-left: auto; }
    .job-meta { margin-top: .55rem; font-size: .78rem; color: var(--muted); font-family: var(--mono); }
    .pill { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--mono); font-size: .8rem; }
    .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .dot.pause { background: var(--warn); }
    .dot.off { background: var(--danger); }
    .stats {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; margin: .75rem 0;
      flex-shrink: 0;
    }
    .job-actions, .job-meta { flex-shrink: 0; }
    .stat {
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
      padding: .7rem .8rem;
    }
    .stat-label { font-size: .72rem; color: var(--muted); margin: 0 0 .35rem; }
    .stat-value { font-family: var(--mono); font-size: .95rem; font-weight: 600; margin: 0; word-break: break-all; }
    .stat-pct { color: var(--muted); font-weight: 500; }
    /* 始终展开的日志面板（不用 details：浏览器对 details+flex 高度约束不可靠，
       会导致 pre 随内容撑高、父级 height:auto，从而无法 overflow 滚动且底边对不齐） */
    .job-log {
      margin-top: .5rem;
      border-top: 1px dashed var(--line);
      padding-top: .5rem;
      /* 吃掉 detail 剩余高度，下沿贴齐视口底（与侧栏 .sidebar-foot 底边对齐） */
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .job-log-head {
      display: flex; align-items: center; gap: .5rem;
      font-size: .82rem; color: var(--accent); font-family: var(--mono);
      flex-shrink: 0; min-width: 0; margin-bottom: .35rem;
    }
    .job-log-title { flex: 0 0 auto; white-space: nowrap; }
    .job-log-path {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: .72rem; color: var(--muted);
    }
    .job-log-head button { flex: 0 0 auto; padding: .35rem .65rem; font-size: .78rem; }
    /* 高度由 flex 链限制；overflow:auto 使滚轮在框内滚动 */
    pre.log {
      margin: 0; flex: 1 1 0; min-height: 0; height: 0;
      overflow: auto; overscroll-behavior: contain;
      background: #0b100e; border: 1px solid var(--line);
      border-radius: 8px; padding: .75rem; font: .72rem/1.45 var(--mono); white-space: pre-wrap; color: #c5d4cb;
    }
    .pause-menu {
      position: fixed; background: #121a16; border: 1px solid var(--line);
      border-radius: 8px; padding: .35rem; min-width: 220px; z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .pause-menu button { display: block; width: 100%; text-align: left; margin: .2rem 0; }
    .pause-wrap { position: relative; z-index: 6; }
    .menu-btn { display: none; }
    .backdrop { display: none; }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; width: min(var(--sidebar-w), 88vw); z-index: 20;
        transform: translateX(-105%); transition: transform .2s ease;
        box-shadow: 8px 0 28px rgba(0,0,0,.35);
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45);
        z-index: 15; opacity: 0; pointer-events: none; transition: opacity .2s ease;
      }
      .backdrop.show { opacity: 1; pointer-events: auto; }
      .menu-btn { display: inline-flex; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .app { height: 100dvh; min-height: 100dvh; }
      .main-body { overflow: auto; }
      pre.log { min-height: 12rem; }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div>
          <p class="sidebar-brand">Quark Auto Download</p>
          <p class="sidebar-title">任务</p>
        </div>
        <button class="btn-primary icon-btn" id="btn-toggle-add" type="button" title="新增任务">+</button>
      </div>
      <div class="add-form hidden" id="add-form">
        <label for="new_name">任务名（必填）</label>
        <input id="new_name" placeholder="必填，不可与已有任务重名" />
        <label for="new_url">分享链接（必填）</label>
        <input id="new_url" placeholder="https://pan.quark.cn/s/xxxx" />
        <label for="new_pwd">提取码（可选）</label>
        <input id="new_pwd" placeholder="可选" />
        <div class="add-actions">
          <button class="btn-primary" id="btn-add" type="button">新增</button>
          <button class="btn-ghost" id="btn-cancel-add" type="button">取消</button>
        </div>
        <div class="msg" id="add-msg"></div>
      </div>
      <div class="sidebar-body" id="job-list"></div>
      <div class="sidebar-foot">
        <button class="btn-ghost" id="btn-refresh" type="button">刷新</button>
        <a class="btn-ghost" href="/settings">设置</a>
      </div>
    </aside>

    <div class="main">
      <div class="main-bar">
        <div class="main-bar-title">
          <button class="btn-ghost icon-btn menu-btn" id="btn-menu" type="button" title="任务列表">☰</button>
          <h1 id="detail-title">
            <span class="detail-title-name" id="detail-title-name" title="点击重命名">任务详情</span>
            <input class="detail-title-edit" id="detail-title-edit" type="text" hidden maxlength="120" aria-label="任务名" />
            <a class="detail-share-url" id="detail-title-url" hidden target="_blank" rel="noopener noreferrer"></a>
          </h1>
        </div>
      </div>
      <div class="main-body">
        <div id="detail-empty" class="empty-hint">在左侧选择或新增任务</div>
        <div id="detail" class="detail" hidden>
          <div class="job-actions">
            <button class="btn-primary job-action-btn" data-act="start" type="button">开始</button>
            <span class="pause-wrap" data-role="pause-wrap">
              <button class="btn-warn job-action-btn" data-act="pause-menu" type="button">暂停 ▾</button>
            </span>
            <button class="btn-danger job-action-btn" data-act="delete" type="button">删除</button>
          </div>
          <div class="job-meta" data-role="meta"></div>
          <div class="stats" data-role="stats"></div>
          <div class="job-log" data-role="log-panel">
            <div class="job-log-head">
              <span class="job-log-title">任务日志</span>
              <span class="job-log-path" data-role="log-path"></span>
              <button class="btn-ghost" data-act="refresh-log" type="button">刷新日志</button>
            </div>
            <pre class="log" data-role="log">加载中…</pre>
          </div>
        </div>
        <div class="msg" id="jobs-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let openPauseMenu = false;
    let selectedId = null;
    let renaming = false;
    /** @type {Map<string, object>} */
    const jobCache = new Map();

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail || res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    function setMsg(el, text, kind = "") {
      el.textContent = text || "";
      el.className = "msg" + (kind ? " " + kind : "");
    }

    function statusView(job) {
      // 以进程存活为准，不单信 status 字符串（避免 stop 后假「运行中」）
      if (job.running || job.pid) {
        if (job.status === "soft_pausing") return { text: "软暂停中", cls: "pause" };
        return { text: "运行中", cls: "on" };
      }
      return { text: "已暂停", cls: "off" };
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isHttpUrl(url) {
      try {
        const u = new URL(String(url || "").trim());
        return u.protocol === "http:" || u.protocol === "https:";
      } catch {
        return false;
      }
    }

    function isJobRunning(job) {
      return !!(job && (job.running || job.pid));
    }

    function formatSize(bytes) {
      const n = Math.max(Number(bytes) || 0, 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) {
        const v = n / 1024;
        return `${v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")} KB`;
      }
      if (n < 1024 * 1024 * 1024) {
        const v = n / (1024 * 1024);
        return `${v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")} MB`;
      }
      const v = n / (1024 * 1024 * 1024);
      return `${v.toFixed(v >= 10 ? 1 : 2).replace(/\.0$/, "")} GB`;
    }

    function jobStats(job) {
      const s = job.stats || {};
      const total_files = Number(s.total_files ?? job.total_files ?? 0) || 0;
      const done_files = Number(s.done_files ?? job.done_files ?? 0) || 0;
      const total_size = Number(s.total_size ?? job.total_size ?? 0) || 0;
      const existing_or_done_size =
        Number(s.existing_or_done_size ?? job.existing_or_done_size ?? 0) || 0;

      let filesPct =
        s.existing_or_done_files_percent ?? job.existing_or_done_files_percent;
      if (filesPct == null || filesPct === "") {
        filesPct = total_files > 0 ? (100 * done_files) / total_files : null;
      } else {
        filesPct = Number(filesPct);
        if (!Number.isFinite(filesPct)) filesPct = null;
      }

      let sizePct = s.existing_or_done_percent ?? job.existing_or_done_percent;
      if (sizePct == null || sizePct === "") {
        sizePct = total_size > 0 ? (100 * existing_or_done_size) / total_size : null;
      } else {
        sizePct = Number(sizePct);
        if (!Number.isFinite(sizePct)) sizePct = null;
      }

      return {
        total_files,
        total_size,
        done_files,
        existing_or_done_size,
        existing_or_done_files_percent: filesPct,
        existing_or_done_percent: sizePct,
      };
    }

    function formatExistingPercent(pct) {
      if (pct == null || !Number.isFinite(pct)) return "—";
      const v = Math.round(pct * 10) / 10;
      return `${Number.isInteger(v) ? v : v.toFixed(1)}%`;
    }

    function formatFilesProgress(done, total, pct) {
      return `${done} / ${total} (${formatExistingPercent(pct)})`;
    }

    function formatSidebarFilesProgress(done, total, pct) {
      const t = Number(total) || 0;
      if (t <= 0) return "—";
      return `${Number(done) || 0}/${t} (${formatExistingPercent(pct)})`;
    }

    function positionPauseMenu(menu, anchorBtn) {
      if (!menu || !anchorBtn) return;
      const r = anchorBtn.getBoundingClientRect();
      const mw = Math.max(menu.offsetWidth || 0, 220);
      const mh = menu.offsetHeight || 0;
      let left = r.right - mw;
      let top = r.bottom + 4;
      left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
      if (mh && top + mh > window.innerHeight - 8) {
        top = Math.max(8, r.top - mh - 4);
      }
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      menu.style.right = "auto";
    }

    function formatSizeProgress(existing, total, pct) {
      return `${formatSize(existing)} / ${formatSize(total)} (${formatExistingPercent(pct)})`;
    }

    function jobDisplayName(job) {
      const name = String(job?.name || "").trim();
      if (name) return name;
      return String(job?.id || "").trim() || "(未命名)";
    }

    function setSidebarOpen(open) {
      $("sidebar").classList.toggle("open", open);
      $("backdrop").classList.toggle("show", open);
    }

    function buildPauseMenu() {
      return `
        <div class="pause-menu">
          <button class="btn-ghost" data-act="pause-soft" type="button">软暂停：保留下载中，清排队</button>
          <button class="btn-danger" data-act="pause-hard" type="button">硬暂停：暂停下载中+排队（可恢复）</button>
        </div>`;
    }

    function createListItem(job) {
      const st = statusView(job);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "job-item" + (selectedId === job.id ? " active" : "");
      el.dataset.id = job.id;
      el.innerHTML = `
        <div class="job-item-row">
          <div class="job-item-url" data-role="item-url">${escapeHtml(jobDisplayName(job))}</div>
          <div class="job-item-meta" data-role="item-meta">
            <span class="pill"><span class="dot ${st.cls}"></span>${st.text}</span>
            <span data-role="item-progress"></span>
          </div>
        </div>`;
      patchListItem(el, job);
      return el;
    }

    function patchListItem(el, job) {
      const st = statusView(job);
      const stats = jobStats(job);
      el.classList.toggle("active", selectedId === job.id);
      const urlEl = el.querySelector('[data-role="item-url"]');
      const nextTitle = jobDisplayName(job);
      if (urlEl && urlEl.textContent !== nextTitle) urlEl.textContent = nextTitle;
      const meta = el.querySelector('[data-role="item-meta"]');
      if (meta) {
        meta.innerHTML =
          `<span class="pill"><span class="dot ${st.cls}"></span>${st.text}</span>` +
          `<span data-role="item-progress">${escapeHtml(formatSidebarFilesProgress(stats.done_files, stats.total_files, stats.existing_or_done_files_percent))}</span>`;
      }
    }

    function statsHtml(job) {
      const s = jobStats(job);
      return `
        <div class="stat">
          <p class="stat-label">已有文件数 / 总文件数</p>
          <p class="stat-value">${escapeHtml(formatFilesProgress(s.done_files, s.total_files, s.existing_or_done_files_percent))}</p>
        </div>
        <div class="stat">
          <p class="stat-label">已有文件大小 / 总文件大小</p>
          <p class="stat-value">${escapeHtml(formatSizeProgress(s.existing_or_done_size, s.total_size, s.existing_or_done_percent))}</p>
        </div>`;
    }

    function metaHtml(job) {
      const st = statusView(job);
      const msg = String(job.message || "").trim();
      // 启动类文案与 status pill / pid 重复，不展示
      const hideMsg = !msg || /^(运行中|已开始|已启动(\s*PID[=＝]\S*)?)$/i.test(msg);
      let html =
        `<span class="pill"><span class="dot ${st.cls}"></span>${st.text}</span>` +
        ` · id=${escapeHtml(job.id)}`;
      if (job.pid) html += ` · pid=${job.pid}`;
      if (!hideMsg) html += ` · ${escapeHtml(msg)}`;
      return html;
    }

    function setDetailTitle(job) {
      const nameEl = $("detail-title-name");
      const editEl = $("detail-title-edit");
      const urlEl = $("detail-title-url");
      if (renaming) return;
      if (!job) {
        nameEl.hidden = false;
        nameEl.textContent = "任务详情";
        nameEl.title = "";
        nameEl.style.cursor = "default";
        editEl.hidden = true;
        urlEl.hidden = true;
        urlEl.removeAttribute("href");
        urlEl.textContent = "";
        return;
      }
      nameEl.hidden = false;
      nameEl.textContent = jobDisplayName(job);
      nameEl.title = "点击重命名";
      nameEl.style.cursor = "text";
      editEl.hidden = true;
      const raw = String(job.share_url || "").trim();
      if (raw && isHttpUrl(raw)) {
        urlEl.hidden = false;
        urlEl.href = raw;
        urlEl.textContent = raw;
      } else {
        urlEl.hidden = true;
        urlEl.removeAttribute("href");
        urlEl.textContent = "";
      }
    }

    function beginRename() {
      if (!selectedId || renaming) return;
      const job = jobCache.get(selectedId);
      if (!job) return;
      renaming = true;
      const nameEl = $("detail-title-name");
      const editEl = $("detail-title-edit");
      nameEl.hidden = true;
      editEl.hidden = false;
      editEl.value = jobDisplayName(job);
      editEl.focus();
      editEl.select();
    }

    async function commitRename({ cancel = false } = {}) {
      if (!renaming) return;
      const editEl = $("detail-title-edit");
      const id = selectedId;
      const job = id ? jobCache.get(id) : null;
      const prev = job ? jobDisplayName(job) : "";
      const next = editEl.value.trim();
      renaming = false;
      editEl.hidden = true;
      $("detail-title-name").hidden = false;
      if (cancel || !id || !job) {
        setDetailTitle(job || null);
        return;
      }
      if (!next) {
        setMsg($("jobs-msg"), "任务名不能为空", "err");
        setDetailTitle(job);
        return;
      }
      if (next === prev) {
        setDetailTitle(job);
        return;
      }
      try {
        await api(`/api/jobs/${id}`, {
          method: "PATCH",
          body: JSON.stringify({ name: next }),
        });
        setMsg($("jobs-msg"), "已重命名", "ok");
        await refreshJobs({ silentLog: true });
      } catch (e) {
        setMsg($("jobs-msg"), e.message, "err");
        setDetailTitle(jobCache.get(id) || job);
      }
    }

    function patchDetail(job) {
      const box = $("detail");
      const empty = $("detail-empty");
      if (!job) {
        box.hidden = true;
        empty.hidden = false;
        setDetailTitle(null);
        return;
      }
      empty.hidden = true;
      box.hidden = false;
      setDetailTitle(job);

      const running = isJobRunning(job);
      const startBtn = box.querySelector('button[data-act="start"]');
      const pauseBtn = box.querySelector('button[data-act="pause-menu"]');
      if (startBtn) startBtn.disabled = running;
      if (pauseBtn) pauseBtn.disabled = !running;

      const pauseWrap = box.querySelector('[data-role="pause-wrap"]');
      if (pauseWrap) {
        const hasMenu = !!pauseWrap.querySelector(".pause-menu");
        if (openPauseMenu && !hasMenu) {
          pauseWrap.insertAdjacentHTML("beforeend", buildPauseMenu());
          const menu = pauseWrap.querySelector(".pause-menu");
          const anchor = pauseWrap.querySelector('button[data-act="pause-menu"]');
          positionPauseMenu(menu, anchor);
        } else if (openPauseMenu && hasMenu) {
          positionPauseMenu(
            pauseWrap.querySelector(".pause-menu"),
            pauseWrap.querySelector('button[data-act="pause-menu"]')
          );
        } else if (!openPauseMenu && hasMenu) {
          pauseWrap.querySelector(".pause-menu")?.remove();
        }
      }

      const metaEl = box.querySelector('[data-role="meta"]');
      const nextMeta = metaHtml(job);
      if (metaEl && metaEl.innerHTML !== nextMeta) metaEl.innerHTML = nextMeta;

      const statsEl = box.querySelector('[data-role="stats"]');
      const nextStats = statsHtml(job);
      if (statsEl && statsEl.innerHTML !== nextStats) statsEl.innerHTML = nextStats;

      const pathEl = box.querySelector('[data-role="log-path"]');
      if (pathEl && job.log_path && pathEl.textContent !== job.log_path) {
        pathEl.textContent = job.log_path;
      }
    }

    async function fillJobLog({ scrollBottom = false } = {}) {
      if (!selectedId) return;
      const pre = $("detail").querySelector('[data-role="log"]');
      const pathEl = $("detail").querySelector('[data-role="log-path"]');
      if (!pre) return;
      const prevScroll = pre.scrollTop;
      const nearBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
      try {
        const data = await api(`/api/jobs/${selectedId}/logs?lines=250`);
        if (pathEl) pathEl.textContent = data.path || "";
        const next = data.content || "(暂无日志)";
        if (pre.textContent !== next) {
          pre.textContent = next;
          if (scrollBottom || nearBottom) pre.scrollTop = pre.scrollHeight;
          else pre.scrollTop = prevScroll;
        }
      } catch (e) {
        pre.textContent = `读取日志失败: ${e.message}`;
      }
    }

    function selectJob(id, { closeSidebar = true } = {}) {
      if (renaming && id !== selectedId) {
        // 切换任务时放弃未提交的编辑
        renaming = false;
        $("detail-title-edit").hidden = true;
        $("detail-title-name").hidden = false;
      }
      selectedId = id || null;
      openPauseMenu = false;
      for (const el of $("job-list").querySelectorAll(".job-item")) {
        el.classList.toggle("active", el.dataset.id === selectedId);
      }
      const job = selectedId ? jobCache.get(selectedId) : null;
      patchDetail(job || null);
      if (closeSidebar && window.matchMedia("(max-width: 820px)").matches) {
        setSidebarOpen(false);
      }
      if (selectedId) fillJobLog({ scrollBottom: true });
    }

    function syncJobs(jobs) {
      const box = $("job-list");
      const ids = new Set(jobs.map((j) => j.id));

      if (!jobs.length) {
        box.innerHTML = '<div class="empty-hint" style="padding:1rem .4rem;text-align:left;">暂无任务，点右上角 + 新增</div>';
        jobCache.clear();
        selectedId = null;
        patchDetail(null);
        return;
      }
      box.querySelector(".empty-hint")?.remove();

      for (const el of [...box.querySelectorAll(".job-item")]) {
        if (!ids.has(el.dataset.id)) el.remove();
      }

      let anchor = null;
      for (const job of jobs) {
        let el = box.querySelector(`.job-item[data-id="${job.id}"]`);
        if (!el) el = createListItem(job);
        else patchListItem(el, job);

        if (!anchor) {
          if (box.firstChild !== el) box.insertBefore(el, box.firstChild);
        } else if (anchor.nextSibling !== el) {
          box.insertBefore(el, anchor.nextSibling);
        }
        anchor = el;
        jobCache.set(job.id, job);
      }

      if (selectedId && !jobCache.has(selectedId)) {
        selectedId = null;
        openPauseMenu = false;
      }
      if (!selectedId && jobs.length) {
        selectedId = jobs[0].id;
      }
      patchDetail(selectedId ? jobCache.get(selectedId) : null);
      for (const el of box.querySelectorAll(".job-item")) {
        el.classList.toggle("active", el.dataset.id === selectedId);
      }
    }

    async function refreshJobs({ silentLog = true } = {}) {
      const data = await api("/api/jobs");
      const jobs = data.jobs || [];
      syncJobs(jobs);
      if (silentLog && selectedId) {
        fillJobLog({ scrollBottom: false });
      }
    }

    function showAddForm(show) {
      $("add-form").classList.toggle("hidden", !show);
      if (show) $("new_name").focus();
    }

    $("btn-toggle-add").onclick = () => {
      const hidden = $("add-form").classList.contains("hidden");
      showAddForm(hidden);
    };
    $("btn-cancel-add").onclick = () => {
      showAddForm(false);
      setMsg($("add-msg"), "");
    };

    $("btn-add").onclick = async () => {
      try {
        const name = $("new_name").value.trim();
        if (!name) {
          setMsg($("add-msg"), "请填写任务名", "err");
          $("new_name").focus();
          return;
        }
        const data = await api("/api/jobs", {
          method: "POST",
          body: JSON.stringify({
            name,
            share_url: $("new_url").value.trim(),
            share_pwd: $("new_pwd").value,
          }),
        });
        $("new_name").value = "";
        $("new_url").value = "";
        $("new_pwd").value = "";
        setMsg($("add-msg"), "已新增（默认暂停）", "ok");
        showAddForm(false);
        await refreshJobs({ silentLog: false });
        if (data.job?.id) selectJob(data.job.id, { closeSidebar: false });
      } catch (e) {
        setMsg($("add-msg"), e.message, "err");
      }
    };

    $("btn-refresh").onclick = async () => {
      try {
        await refreshJobs();
        setMsg($("jobs-msg"), "已刷新", "ok");
      } catch (e) {
        setMsg($("jobs-msg"), e.message, "err");
      }
    };

    $("btn-menu").onclick = () => setSidebarOpen(!$("sidebar").classList.contains("open"));
    $("backdrop").onclick = () => setSidebarOpen(false);

    $("detail-title-name").addEventListener("click", (ev) => {
      if (!selectedId) return;
      ev.preventDefault();
      beginRename();
    });
    $("detail-title-edit").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        commitRename();
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        commitRename({ cancel: true });
      }
    });
    $("detail-title-edit").addEventListener("blur", () => {
      commitRename();
    });

    $("job-list").addEventListener("click", (ev) => {
      const item = ev.target.closest(".job-item");
      if (!item) return;
      if (renaming) commitRename({ cancel: true });
      selectJob(item.dataset.id);
    });

    $("detail").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn || !selectedId) return;
      const id = selectedId;
      const act = btn.dataset.act;
      try {
        if (act === "pause-menu") {
          openPauseMenu = !openPauseMenu;
          const job = jobCache.get(id);
          if (job) patchDetail(job);
          return;
        }
        if (act === "refresh-log") {
          ev.preventDefault();
          ev.stopPropagation();
          await fillJobLog({ scrollBottom: true });
          return;
        }
        openPauseMenu = false;
        if (act === "start") {
          await api(`/api/jobs/${id}/start`, { method: "POST", body: "{}" });
        } else if (act === "pause-soft") {
          await api(`/api/jobs/${id}/pause`, { method: "POST", body: JSON.stringify({ mode: "soft" }) });
          setMsg($("jobs-msg"), "已下发软暂停", "ok");
        } else if (act === "pause-hard") {
          await api(`/api/jobs/${id}/pause`, { method: "POST", body: JSON.stringify({ mode: "hard" }) });
          setMsg($("jobs-msg"), "已硬暂停", "ok");
        } else if (act === "delete") {
          const job = jobCache.get(id);
          const label = jobDisplayName(job || { id });
          if (!confirm(`确定删除任务「${label}」？删除后不可恢复。`)) return;
          await api(`/api/jobs/${id}`, { method: "DELETE" });
          selectedId = null;
          setMsg($("jobs-msg"), "已删除", "ok");
        }
        await refreshJobs({ silentLog: false });
        if (selectedId) await fillJobLog({ scrollBottom: true });
      } catch (e) {
        setMsg($("jobs-msg"), e.message, "err");
        await refreshJobs({ silentLog: false });
      }
    });

    document.addEventListener("click", (ev) => {
      if (!ev.target.closest(".pause-wrap") && openPauseMenu) {
        openPauseMenu = false;
        const job = selectedId ? jobCache.get(selectedId) : null;
        if (job) patchDetail(job);
      }
    });

    (async () => {
      await refreshJobs({ silentLog: false });
      setInterval(() => {
        refreshJobs().catch(() => {});
      }, 5000);
    })();
  </script>
</body>
</html>
