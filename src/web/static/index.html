        if (!check.checked && takenNow && takenNow.job_id === selectedId) {
          // 取消勾选「已在本任务里」的条目 = 从任务勾选里移除（可再重新勾选）
          treeRemoveTaken(fid, row.dataset.dir === "1");
          return;
        }
        if (row.dataset.dir === "1") {
          if (check.checked) {
            treeState.selectedDirs.add(fid);
            treeDropSubtree(fid);
          } else {
            treeState.selectedDirs.delete(fid);
          }
        } else if (check.checked) {
          treeState.selectedFiles.add(fid);
        } else {
          treeState.selectedFiles.delete(fid);
        }
        treeRefreshAll();
        treeSyncHeader(selectedId ? jobCache.get(selectedId) : null);
      });
    }

    treeBindPanel();

    $("btn-add").onclick = async () => {
      try {
        const name = $("new_name").value.trim();
        if (!name) {
          setMsg($("add-msg"), "请填写任务名", "err");

          return;
        }
        if (!shareUrl.includes("/s/")) {
          setMsg($("add-msg"), "分享链接格式不对，应形如 https://pan.quark.cn/s/xxxx", "err");
          return;
        }
        const data = await api("/api/jobs", {
          method: "POST",

            name,
            share_url: shareUrl,
            share_pwd: $("new_pwd").value,
            aria2_profile: $("new_aria2").value || "",
          }),

        $("new_name").value = "";
        $("new_url").value = "";
        $("new_pwd").value = "";
        setMsg(

        );
        showAddForm(false);

      } catch (e) {

    };

    $("btn-refresh").onclick = async () => {
      try {
        await refreshJobs();
        setMsg($("jobs-msg"), "已刷新", "ok");
      } catch (e) {
        setMsg($("jobs-msg"), e.message, "err");
      }
    };

    $("btn-menu").onclick = () => setSidebarOpen(!$("sidebar").classList.contains("open"));
    $("backdrop").onclick = () => setSidebarOpen(false);

    $("detail-title-name").addEventListener("click", (ev) => {
      if (!selectedId) return;
      ev.preventDefault();
      beginRename();
    });
    $("detail-title-edit").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {

      } else if (ev.key === "Escape") {

    $("job-list").addEventListener("click", (ev) => {

    $("detail").addEventListener("input", (ev) => {
      const el = ev.target;
      if (!el || el.getAttribute("data-role") !== "files-filter") return;
      fileState.filter = el.value || "";
      renderFileList();
    });

    const jobActionBusy = new Set();

    $("detail").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn || !selectedId) return;
      const id = selectedId;
      const act = btn.dataset.act;
      // 连点保护：第二次点击在第一个请求回来前就发出去了，只会弹一条假错误
      const guardable = act === "start" || act === "pause-soft" || act === "pause-hard" || act === "delete";
      const busyKey = id + ":" + act;
      if (guardable && jobActionBusy.has(busyKey)) return;
      if (guardable) {
        jobActionBusy.add(busyKey);
        btn.disabled = true;
      }
      try {
        if (act === "pause-menu") {
          openPauseMenu = !openPauseMenu;
          const job = jobCache.get(id);
          if (job) patchDetail(job);
          return;
        }
        if (act === "refresh-log") {
          ev.preventDefault();
          ev.stopPropagation();
          await fillJobLog({ scrollBottom: true });
          return;
        }
        if (act === "tree-reload") {
          ev.preventDefault();
          ev.stopPropagation();
          await treeLoadRoot({ force: true });
          return;
        }
        if (act === "tree-clear") {
          ev.preventDefault();
          ev.stopPropagation();
          treeClearSelection();
          return;
        }
        if (act === "tree-download") {
          ev.preventDefault();
          ev.stopPropagation();
          await treeDownloadSelected();
          return;
        }
        openPauseMenu = false;
        if (act === "start") {
          await api(`/api/jobs/${id}/start`, { method: "POST", body: "{}" });
        } else if (act === "pause-soft") {
          await api(`/api/jobs/${id}/pause`, { method: "POST", body: JSON.stringify({ mode: "soft" }) });
          setMsg($("jobs-msg"), "已下发软暂停", "ok");
        } else if (act === "pause-hard") {
          await api(`/api/jobs/${id}/pause`, { method: "POST", body: JSON.stringify({ mode: "hard" }) });
          setMsg($("jobs-msg"), "已硬暂停", "ok");
        } else if (act === "delete") {
          const job = jobCache.get(id);
          const label = jobDisplayName(job || { id });
          if (!confirm(`确定删除任务「${label}」？删除后不可恢复。`)) return;
          await api(`/api/jobs/${id}`, { method: "DELETE" });
          selectedId = null;
          setMsg($("jobs-msg"), "已删除", "ok");
        }
        await refreshJobs({ silentLog: false });
        if (selectedId) await fillJobLog({ scrollBottom: true });
      } catch (e) {
        setMsg($("jobs-msg"), e.message, "err");
        await refreshJobs({ silentLog: false });
      } finally {
        if (guardable) {
          jobActionBusy.delete(busyKey);
          btn.disabled = false;
        }
      }
    });

    document.addEventListener("click", (ev) => {
      if (!ev.target.closest(".pause-wrap") && openPauseMenu) {
        openPauseMenu = false;
        const job = selectedId ? jobCache.get(selectedId) : null;
        if (job) patchDetail(job);
      }
    });

    (async () => {
      await refreshJobs({ silentLog: false });
      loadAria2Profiles();  // 预填下拉，打开新增表单就不用等接口
      setInterval(() => {
        refreshJobs().catch(() => {});
      }, 5000);
      api("/api/health")
        .then((h) => {
          const el = $("app-ver");
          if (el && h && h.version) el.textContent = "v" + h.version;
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
